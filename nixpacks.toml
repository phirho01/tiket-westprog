[providers]
providers = ['php', 'node']

[phases.setup]
nixPkgs = ['php81', 'php81Packages.composer', 'php81Extensions.pdo_pgsql', 'php81Extensions.pgsql', 'nodejs']

[phases.build]
cmds = ['npm run build', 'composer install --no-dev --optimize-autoloader']

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=$PORT'
